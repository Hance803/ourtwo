<!doctype html>
<html lang="zh-Hant">
<head><base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17201D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ourtwo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ourtwo</title>
<script>try{var t=localStorage.getItem('ourtwo.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="fonts/naikai.css?v=1">
<link rel="stylesheet" href="preview/style.css?t=1793173249">
</head>
<body>

<section class="login" id="login" hidden>
  <div class="login-in">
    <h1>Ourtwo</h1>
    <p class="muted">兩支手機輸入同一組家庭暗號，就會共用同一份資料。</p>
    <label class="f"><span>家庭暗號（至少 10 個字）</span><input id="login-code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <div class="f"><span>這支手機是誰在用</span>
      <div class="seg" style="align-self:flex-start" role="group" aria-label="這支手機是誰在用">
        <button data-act="loginWho" data-v="老公" aria-pressed="true">老公</button>
        <button data-act="loginWho" data-v="老婆" aria-pressed="false">老婆</button>
      </div>
    </div>
    <p class="muted" style="font-size:13px">暗號就是進入資料的唯一鑰匙。請不要告訴別人，也不要用生日、電話這類好猜的字。</p>
    <button class="btn" id="login-btn" data-act="login">進入</button>
    <p class="err" id="login-err" hidden></p>
  </div>
</section>

<div id="shell" hidden>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow" id="today-label"></p>
      <h1>Ourtwo</h1>
    </div>
    <div class="seg" role="group" aria-label="目前是誰在用">
      <button data-act="me" data-v="老公" aria-pressed="true">老公</button>
      <button data-act="me" data-v="老婆" aria-pressed="false">老婆</button>
    </div>
  </header>
  <p class="banner" id="net" hidden></p>

  <main>
    <section data-tab="home" id="tab-home"><div class="stack" id="home-body"></div></section>

    <section data-tab="cal" id="tab-cal" hidden>
      <div class="page-heading"><h2>班表</h2><p>把有空的日子，留給彼此。</p></div><div class="stack" id="cal-body"></div></section>

    <section data-tab="period" id="tab-period" hidden>
      <div class="page-heading"><button class="btn ghost small back" data-act="tab" data-v="home">‹ 回今天</button><h2>經期</h2><p>每個週期，都好好照顧自己。</p></div>
      <div class="stack">
        <div class="stack" id="period-body"></div>
        <div class="card period-settings">
          <h3>週期設定</h3>
          <div class="row3">
            <label class="f"><span>上次經期開始</span><input id="p-last" type="date"></label>
            <label class="f"><span>週期天數</span><input id="p-cycle" type="number" inputmode="numeric" min="20" max="45"></label>
            <label class="f"><span>經期天數</span><input id="p-plen" type="number" inputmode="numeric" min="2" max="10"></label>
          </div>
          <button class="btn ghost small" data-act="startToday">今天開始經期</button>
          <p class="muted" style="font-size:13px">排卵日以「下次經期開始前 14 天」推算，易孕期是排卵日前 5 天到後 1 天。這些日期只是估計，請不要當成避孕方法。</p>
        </div>
      </div>
    </section>

    <section data-tab="memo" id="tab-memo" hidden>
      <div class="page-heading"><button class="btn ghost small back" data-act="tab" data-v="home">‹ 回今天</button><h2>備忘</h2><p>一起記住生活裡的小事。</p></div>
      <div class="stack">
        <div class="seg" style="align-self:flex-start" role="group" aria-label="備忘類型">
          <button data-act="memoMode" data-v="todo" aria-pressed="true">清單</button>
          <button data-act="memoMode" data-v="note" aria-pressed="false">筆記</button>
        </div>
        <div class="card" id="memo-todo-form">
          <div class="inline">
            <input id="todo-text" type="text" placeholder="要買的、要做的事" maxlength="60" aria-label="新增清單項目">
            <button class="btn" data-act="addTodo">加入</button>
          </div>
        </div>
        <div class="card" id="memo-note-form" hidden>
          <label class="f"><span>標題</span><input id="note-title" type="text" maxlength="30" placeholder="例如：想去的餐廳"></label>
          <label class="f"><span>內容</span><textarea id="note-body" placeholder="想記下來的內容"></textarea></label>
          <button class="btn" data-act="addNote">存成筆記</button>
        </div>
        <div class="stack" id="memo-body"></div>
      </div>
    </section>

    <section data-tab="board" id="tab-board" hidden>
      <div class="page-heading"><h2>黑板</h2><p>寫一句，畫一下，留給另一半。</p></div>
      <div class="stack">
        <div class="card board-editor">
          <input type="file" id="photo" accept="image/*" hidden>
          <div class="padwrap"><canvas id="pad" aria-label="手繪區"></canvas><div class="hint" id="pad-hint">用手指在這裡畫</div></div>
          <div class="row wrap">
            <div class="seg tools" id="tools" role="group" aria-label="工具">
              <button data-act="tool" data-v="chalk" aria-pressed="true">粉筆</button>
              <button data-act="tool" data-v="marker" aria-pressed="false">麥克筆</button>
              <button data-act="tool" data-v="crayon" aria-pressed="false">蠟筆</button>
              <button data-act="tool" data-v="hl" aria-pressed="false">螢光筆</button>
              <button data-act="tool" data-v="eraser" aria-pressed="false">橡皮擦</button>
              <button data-act="tool" data-v="sticker" aria-pressed="false">貼紙</button>
            </div>
            <div class="swatches" id="swatches">
              <button class="sw" style="background:#f1efe6" data-act="color" data-c="#f1efe6" aria-label="白" aria-pressed="true"></button>
              <button class="sw" style="background:#f4a3b5" data-act="color" data-c="#f4a3b5" aria-label="粉紅" aria-pressed="false"></button>
              <button class="sw" style="background:#f6d36b" data-act="color" data-c="#f6d36b" aria-label="黃" aria-pressed="false"></button>
              <button class="sw" style="background:#8fc8ec" data-act="color" data-c="#8fc8ec" aria-label="藍" aria-pressed="false"></button>
              <button class="sw" style="background:#a8d8a0" data-act="color" data-c="#a8d8a0" aria-label="綠" aria-pressed="false"></button>
              <button class="sw" style="background:#f4a261" data-act="color" data-c="#f4a261" aria-label="橘" aria-pressed="false"></button>
              <button class="sw" style="background:#c3a6e8" data-act="color" data-c="#c3a6e8" aria-label="紫" aria-pressed="false"></button>
              <button class="sw" style="background:#e76f6f" data-act="color" data-c="#e76f6f" aria-label="紅" aria-pressed="false"></button>
            </div>
            <div class="stickers" id="stickers" hidden>
              <button data-act="sticker" data-s="❤️" aria-pressed="true" aria-label="貼紙 ❤️">❤️</button>
              <button data-act="sticker" data-s="💕" aria-pressed="false" aria-label="貼紙 💕">💕</button>
              <button data-act="sticker" data-s="⭐" aria-pressed="false" aria-label="貼紙 ⭐">⭐</button>
              <button data-act="sticker" data-s="🌸" aria-pressed="false" aria-label="貼紙 🌸">🌸</button>
              <button data-act="sticker" data-s="🐱" aria-pressed="false" aria-label="貼紙 🐱">🐱</button>
              <button data-act="sticker" data-s="🐶" aria-pressed="false" aria-label="貼紙 🐶">🐶</button>
              <button data-act="sticker" data-s="🐰" aria-pressed="false" aria-label="貼紙 🐰">🐰</button>
              <button data-act="sticker" data-s="🐻" aria-pressed="false" aria-label="貼紙 🐻">🐻</button>
              <button data-act="sticker" data-s="🐷" aria-pressed="false" aria-label="貼紙 🐷">🐷</button>
              <button data-act="sticker" data-s="🐥" aria-pressed="false" aria-label="貼紙 🐥">🐥</button>
              <button data-act="sticker" data-s="🍙" aria-pressed="false" aria-label="貼紙 🍙">🍙</button>
              <button data-act="sticker" data-s="🍜" aria-pressed="false" aria-label="貼紙 🍜">🍜</button>
              <button data-act="sticker" data-s="🍰" aria-pressed="false" aria-label="貼紙 🍰">🍰</button>
              <button data-act="sticker" data-s="☕" aria-pressed="false" aria-label="貼紙 ☕">☕</button>
              <button data-act="sticker" data-s="🌙" aria-pressed="false" aria-label="貼紙 🌙">🌙</button>
              <button data-act="sticker" data-s="☀️" aria-pressed="false" aria-label="貼紙 ☀️">☀️</button>
              <button data-act="sticker" data-s="🎉" aria-pressed="false" aria-label="貼紙 🎉">🎉</button>
              <button data-act="sticker" data-s="😴" aria-pressed="false" aria-label="貼紙 😴">😴</button>
              <button data-act="sticker" data-s="💪" aria-pressed="false" aria-label="貼紙 💪">💪</button>
              <button data-act="sticker" data-s="🥰" aria-pressed="false" aria-label="貼紙 🥰">🥰</button>
            </div>
            <div class="seg" id="brushes" role="group" aria-label="粗細或貼紙大小">
              <button data-act="brush" data-w="2.5" aria-pressed="false">細</button>
              <button data-act="brush" data-w="5" aria-pressed="true">中</button>
              <button data-act="brush" data-w="9" aria-pressed="false">粗</button>
            </div>
          </div>
          <div class="row">
            <button class="btn ghost small" data-act="undo">復原一筆</button>
            <button class="btn ghost small" data-act="photoPick">加照片</button>
            <button class="btn ghost small" id="photo-clear" data-act="photoClear" hidden>移除照片</button>
            <button class="btn ghost small" id="zoom-reset" data-act="zoomReset" hidden>還原大小</button>
            <button class="btn ghost small" data-act="clearPad">全部擦掉</button>
          </div>
          <label class="f"><span>寫一句話（可以不寫）</span><input id="caption" type="text" maxlength="40" placeholder="今天也辛苦了"></label>
          <button class="btn" data-act="post">貼上黑板</button>
        </div>
        <h3>黑板歷史</h3>
        <div class="stack" id="wall"></div>
      </div>
    </section>
    <section data-tab="mood" id="tab-mood" hidden>
      <div class="page-heading"><h2>心情</h2><p>記下今天，也看看另一半的今天。</p></div>
      <div class="stack">
        <div class="card mood-editor">
          <div class="row"><h3 id="mood-title">今天的心情</h3><button class="btn ghost small" data-act="mToday" id="mood-today" hidden>回到今天</button></div>
          <div class="moods" id="moods" role="group" aria-label="心情"></div>
          <label class="f"><span>今天做了什麼</span><textarea id="mood-did" maxlength="500" placeholder="例如：上早班、下班一起去吃拉麵"></textarea></label>
          <label class="f"><span>想說的話</span><textarea id="mood-text" maxlength="1000" placeholder="今天的心情、想對另一半說的話"></textarea></label>
          <div class="row"><span class="muted">手繪小圖</span><span class="row"><button class="btn ghost small" data-act="mUndo">復原</button><button class="btn ghost small" data-act="mClear">清掉</button></span></div>
          <div class="mpadwrap"><canvas id="mpad"></canvas></div>
          <div class="mswatches" id="mswatches"></div>
          <div class="row"><button class="btn ghost small" data-act="mPhotoPick">加照片</button><button class="btn ghost small" data-act="mPhotoClear" id="mphoto-clear" hidden>移除照片</button></div>
          <img id="mphoto-prev" class="mphoto" hidden alt="心情照片">
          <input type="file" id="mphoto" accept="image/*" hidden>
          <button class="btn" data-act="mSave">存起來</button>
        </div>
        <div class="stack" id="mood-feed"></div>
      </div>
    </section>

    <section data-tab="play" id="tab-play" hidden>
      <div class="page-heading"><h2>玩</h2><p>無聊的時候，一起玩一下。</p></div>
      <div class="stack" id="play-body"></div>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="主選單"><div class="tabs-in">
  <button data-act="tab" data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>今天</button>
  <button data-act="tab" data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>班表</button>
  <button data-act="tab" data-v="mood"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2M9 9.5h.01M15 9.5h.01"/></svg>心情</button>
  <button data-act="tab" data-v="board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M7 12c2-3 3 1 5-1.5s3 .5 5-1M9 21l1-4M15 21l-1-4"/></svg>黑板</button>
  <button data-act="tab" data-v="play"><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4M15.5 11.5h.01M18 13.5h.01"/></svg>玩</button>
</div></nav>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-panel" id="sheet-panel"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module" src="preview/app.js?t=1793173249"></script>
</body>
</html>
